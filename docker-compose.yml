# region COMMON SETTINGS
x-common-settings: &common-settings
  restart: ${DOCKER_RESTART_POLICY:-unless-stopped}
  networks:
    - obywatel_app_net
    - citizen-app-net

x-common-healthcheck: &common-healthcheck
  interval: 180s
  timeout: 5s
  retries: 5
  start_period: 15s
# endregion

services:
  # region MONGODB
  mongodb:
    <<: *common-settings
    image: mongo:8
    container_name: obywatel_app_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${DATABASE__USER}
      MONGO_APP_PASSWORD: ${DATABASE__PASSWORD}
      MONGO_APP_DATABASE: ${DATABASE__NAME}
    volumes:
      - mongo_data:/data/db
      - ./crates/kms-service/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *common-healthcheck
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "${MONGO_ROOT_USER}",
          "--password",
          "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.getSiblingDB('admin').adminCommand('ping')",
        ]
  # endregion

  postgres:
    <<: *common-settings
    image: postgres:18.3-alpine
    container_name: db_kms
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DATABASE__NAME:-kms_db}
      POSTGRES_USER: ${DATABASE__USER:-kms_user}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:-kms_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      <<: *common-healthcheck
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE__USER:-kms_user} -d ${DATABASE__NAME:-kms_db}",
        ]
  # endregion

  # region REDIS
  # redis:
  #   <<: *common-settings
  #   image: redis:8.6-alpine
  #   container_name: zero_day_redis
  #   ports:
  #     - "6380:6379"
  #   command:
  #     - redis-server
  #     - --requirepass
  #     - ${REDIS__PASSWORD:-change_me}
  #     - --appendonly
  #     - "yes"
  #     - --save
  #     - "60"
  #     - "1"
  #     - --loglevel
  #     - warning
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     <<: *common-healthcheck
  #     test: ["CMD", "redis-cli", "-a", "${REDIS__PASSWORD:-change_me}", "ping"]
  # endregion

  # region VHSM DAEMON
  vhsm-daemon:
    <<: *common-settings
    build:
      context: .
      dockerfile: Dockerfile
      target: vhsm-daemon
    container_name: vhsm_daemon
    entrypoint: ["/app/vhsm-daemon"]
    environment:
      - APP_ENVIRONMENT=${APP_ENVIRONMENT:-development}
      - RUST_LOG=${RUST_LOG:-info,vhsm_daemon=debug}
      - VHSM__SOCKET_PATH=${CRYPTO__HSM_SOCKET_PATH:-/run/vhsm/vhsm.sock}
      - LOG__FORMAT=${LOG__FORMAT:-compact}
    volumes:
      - vhsm_sockets:/run/vhsm
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "test", "-S", "/run/vhsm/vhsm.sock"]
  # endregion

  # region KMS SERVICE (RUST)
  kms-service:
    <<: *common-settings
    build:
      context: .
      dockerfile: Dockerfile
      target: kms-service
    container_name: kms_service
    command: ["serve"]
    ports:
      - "8081:8080"
    environment:
      - APP_CONFIG_PATH=/app/crates/kms-service/config/settings.toml
      - RUST_LOG=${RUST_LOG:-info,kms_service=debug}
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=8080
      - DATABASE__HOST=mongodb
      - DATABASE__PORT=${DATABASE__PORT}
      - DATABASE__NAME=${DATABASE__NAME}
      - DATABASE__USER=${DATABASE__USER}
      - DATABASE__PASSWORD=${DATABASE__PASSWORD}
      - DATABASE__AUTH_SOURCE=${DATABASE__AUTH_SOURCE}
      - APP_REDIS__URL=redis://:${REDIS__PASSWORD:-change_me}@redis:6379/
    volumes:
      - ./crates/kms-service/config:/app/crates/kms-service/config:ro
      - kms_ceremony_data:/app/ceremony:ro
      - vhsm_sockets:/run/vhsm
    depends_on:
      mongodb:
        condition: service_healthy
      vhsm-daemon:
        condition: service_healthy
    # healthcheck:
    #   <<: *common-healthcheck
    #   test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
  # endregion

  # region KMS CEREMONY CLI (TOOLING)
  kms-ceremony-cli:
    <<: *common-settings
    build:
      context: .
      dockerfile: Dockerfile
      target: kms-ceremony-cli
    container_name: kms_ceremony_cli
    profiles:
      - tools
    entrypoint: ["/app/kms-ceremony-cli"]
    environment:
      - VHSM__SOCKET_PATH=/run/vhsm/vhsm.sock
      - CRYPTO__HSM_SOCKET_PATH=/run/vhsm/vhsm.sock
    volumes:
      - kms_ceremony_data:/app/ceremony
      - vhsm_sockets:/run/vhsm
      - ./out:/app/out
    depends_on:
      vhsm-daemon:
        condition: service_healthy
  # endregion

# region VOLUMES
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
  kms_ceremony_data:
    driver: local
  vhsm_sockets:
    driver: local
# endregion

# region NETWORKS
networks:
  obywatel_app_net:
    driver: bridge

  citizen-app-net:
    name: obywatel_app__network
    external: true
# endregion
