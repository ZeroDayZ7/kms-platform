# docker-compose.yml

x-common-healthcheck: &common-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

services:
  postgres:
    image: postgres:18.3-alpine
    container_name: kms_db
    networks:
      - kms-internal-net
    ports:
      - "127.0.0.1:5440:5432"
    environment:
      POSTGRES_DB: ${DATABASE__NAME:-kms_db}
      POSTGRES_USER: ${DATABASE__ROOT_USER:-kms_root_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_root_pass
      POSTGRES_MIGRATOR_USER: ${DATABASE__MIGRATOR_USER:-kms_migrator_user}
      POSTGRES_APP_USER: ${DATABASE__USER:-kms_app_user}
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - db_root_pass
      - kms_migrator_db_pass
      - kms_app_db_pass
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-user.sh:/docker-entrypoint-initdb.d/01-init-user.sh:ro
    healthcheck:
      <<: *common-healthcheck
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE__ROOT_USER:-kms_root_user} -d ${DATABASE__NAME:-kms_db}",
        ]

volumes:
  postgres_data:
    driver: local
  kms_ceremony_data:
    driver: local
  vhsm_sockets:
    driver: local

secrets:
  db_root_pass:
    file: ./secrets/.db_root_password
  kms_app_db_pass:
    file: ./secrets/.kms_app_password
  kms_migrator_db_pass:
    file: ./secrets/.kms_migrator_password

networks:
  kms-internal-net:
    name: kms_internal_net
    driver: bridge
  sec-net:
    name: kms_sec_net
    driver: bridge
  target-admin-net:
    name: kms_target_admin_net
    driver: bridge
