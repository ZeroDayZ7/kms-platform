x-common-healthcheck: &common-healthcheck
  interval: 180s
  timeout: 5s
  retries: 5
  start_period: 15s
# endregion

services:
  # region POSTGRESQL
  postgres:
    image: postgres:18.3-alpine
    container_name: db_kms
    networks:
      - kms-internal-net
    ports:
      - "127.0.0.1:5440:5432"
    environment:
      POSTGRES_DB: ${DATABASE__NAME:-kms_db}
      POSTGRES_USER: ${DATABASE__ROOT_USER:-kms_root_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_root_pass
      KMS_APP_USER: ${DATABASE__USER:-kms_app_user}
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - db_root_pass
      - kms_app_db_pass
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-user.sh:/docker-entrypoint-initdb.d/01-init-user.sh:ro
    healthcheck:
      <<: *common-healthcheck
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE__ROOT_USER:-kms_root_user} -d ${DATABASE__NAME:-kms_db}",
        ]
  # endregion

  # region REDIS
  # redis:
  #   <<: *common-settings
  #   image: redis:8.6-alpine
  #   container_name: zero_day_redis
  #   ports:
  #     - "6380:6379"
  #   command:
  #     - redis-server
  #     - --requirepass
  #     - ${REDIS__PASSWORD:-change_me}
  #     - --appendonly
  #     - "yes"
  #     - --save
  #     - "60"
  #     - "1"
  #     - --loglevel
  #     - warning
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     <<: *common-healthcheck
  #     test: ["CMD", "redis-cli", "-a", "${REDIS__PASSWORD:-change_me}", "ping"]
  # endregion

  # region VHSM DAEMON
  vhsm-daemon:
    build:
      context: .
      dockerfile: Dockerfile
      target: vhsm-daemon
    container_name: vhsm_daemon
    entrypoint: ["/app/vhsm-daemon"]
    networks:
      - kms-internal-net
    environment:
      - APP_ENVIRONMENT=${APP_ENVIRONMENT:-development}
      - RUST_LOG=${RUST_LOG:-info,vhsm_daemon=debug}
      - VHSM__SOCKET_PATH=${CRYPTO__HSM_SOCKET_PATH:-/run/vhsm/vhsm.sock}
      - LOG__FORMAT=${LOG__FORMAT:-compact}
    volumes:
      - vhsm_sockets:/run/vhsm
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "/app/hsm_probe"]
  # endregion

  # region KMS SERVICE (RUST)
  kms-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: kms-service
    container_name: kms_service
    command: ["serve"]
    networks:
      - kms-internal-net
      - citizen-app-net
    ports:
      - "8081:8080"
    environment:
      - APP_CONFIG_PATH=/app/crates/kms-service/config/settings.toml
      - RUST_LOG=${RUST_LOG:-info,kms_service=debug}
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=8080
      - DATABASE__HOST=postgres
      - DATABASE__PORT=5432
      - DATABASE__NAME=${DATABASE__NAME}
      - DATABASE__USER=${DATABASE__USER:-kms_app_user}
      - DATABASE__PASSWORD_FILE=/run/secrets/kms_app_db_pass
    secrets:
      - kms_app_db_pass
    volumes:
      - ./crates/kms-service/config:/app/crates/kms-service/config:ro
      - kms_ceremony_data:/app/ceremony:ro
      - vhsm_sockets:/run/vhsm
    depends_on:
      postgres:
        condition: service_healthy
      vhsm-daemon:
        condition: service_healthy
  # endregion

  # region KMS CEREMONY CLI (TOOLING)
  kms-ceremony-cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: kms-ceremony-cli
    container_name: kms_ceremony_cli
    profiles:
      - tools
    entrypoint: ["/app/kms-ceremony-cli"]
    networks:
      - kms-internal-net
    environment:
      - VHSM__SOCKET_PATH=/run/vhsm/vhsm.sock
      - CRYPTO__HSM_SOCKET_PATH=/run/vhsm/vhsm.sock
      - KMS_CLI__SERVICE_ID=kms-cli
      - KMS_CLI__SECRET=${ACL__SERVICES__KMS_CLI__SECRET:-super-long-random-secret-for-kms-cli-hmac-64-bytes}
      - KMS_CLI__SERVICE_URL=http://kms-service:808
    volumes:
      - kms_ceremony_data:/app/ceremony
      - vhsm_sockets:/run/vhsm
      - ./out:/app/out
    depends_on:
      vhsm-daemon:
        condition: service_healthy
  # endregion

# region VOLUMES
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kms_ceremony_data:
    driver: local
  vhsm_sockets:
    driver: local
# endregion

# region SECRETS
secrets:
  db_root_pass:
    file: ./secrets/.db_root_password
  kms_app_db_pass:
    file: ./secrets/.kms_app_password
# endregion

# region NETWORKS
networks:
  kms-internal-net:
    driver: bridge
    internal: false

  citizen-app-net:
    name: obywatel_app__network
    external: true
# endregion
