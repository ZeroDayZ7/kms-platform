[workspace]
resolver = "2"
members = [
    "crates/kms-core",
    "crates/kms-db",
    "crates/kms-migrate",
    "crates/kms-service",
    "crates/kms-ceremony-cli",
    "crates/vhsm-daemon",
]

[workspace.dependencies]
thiserror = "2.0.19"
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.8"

kms-core = { path = "crates/kms-core" }
kms-db = { path = "crates/kms-db" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true