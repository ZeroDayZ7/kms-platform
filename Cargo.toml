[workspace]
members = [
    "crates/kms-core",
    "crates/kms-db",
    "crates/kms-migrate",
    "crates/kms-service",
    "crates/kms-ceremony-cli",
    "crates/vhsm-daemon",
]
resolver = "2"

[workspace.dependencies]
# External crates shared across the monorepo
aes-gcm = "0.10.3"
anyhow = "1.0.104"
argon2 = "0.5.3"
async-trait = "0.1.91"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
config = "0.15"
dialoguer = "0.11"
dotenvy = "0.15"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core", "pkcs8"] }
fred = { version = "10.1.0", features = ["serde-json", "enable-rustls", "i-scripts"] }
getrandom = "0.2"
governor = "0.10.4"
hmac = "0.12"
hex = "0.4"
pem = "3.0"
pkcs8 = { version = "0.10", features = ["pem", "std"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
ssss = "1.0.6"
subtle = "2.6"
thiserror = "2.0.19"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower_governor = "0.8.0"
tower-http = { version = "0.6", features = ["trace", "cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time", "chrono"] }
uuid = { version = "1.24", features = ["v4", "v7", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# Internal crates used across the monorepo
kms-core = { path = "crates/kms-core" }
kms-db = { path = "crates/kms-db" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true