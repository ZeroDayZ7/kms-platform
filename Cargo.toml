[workspace]
resolver = "2"
members = [
    "crates/kms-core",
    "crates/kms-service",
    "crates/kms-ceremony-cli",
    "crates/vhsm-daemon",
]

[workspace.dependencies]
async-trait = "0.1"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"