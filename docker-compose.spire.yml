version: "3.9"

services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.1
    container_name: spire-server
    hostname: spire-server
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./spire/server:/opt/spire/conf/server:ro
      - spire-server-data:/run/spire/data
    networks:
      - spire-net
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/spire-server healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.11.1
    container_name: spire-agent
    hostname: spire-agent
    depends_on:
      spire-server:
        condition: service_healthy
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
    volumes:
      - ./spire/agent:/opt/spire/conf/agent:ro
      - spire-agent-data:/run/spire/data
      - spire-agent-socket:/tmp
    networks:
      - spire-net
    privileged: true
    pid: "host"
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/spire-agent healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  kms-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: kms-service
    container_name: kms-spire-service
    hostname: kms-spire-service
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /tmp/spire-kms && \
        /usr/local/bin/spire-agent api fetch x509 -socketPath /tmp/spire-agent.sock -write /tmp/spire-kms && \
        /app/kms-service serve
    environment:
      - APP_CONFIG_PATH=/app/crates/kms-service/config/settings.toml
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=8080
      - RUST_LOG=debug,kms_service=debug
      - AUTH__SPIFFE__ENABLED=true
      - AUTH__SPIFFE__TRUST_DOMAIN=example.org
      - AUTH__SPIFFE__WORKLOAD_ID=/kms
      - AUTH__SPIFFE__SPIRE_AGENT_SOCKET_PATH=/tmp/spire-agent.sock
      - AUTH__SPIFFE__TLS_CERT_PATH=/tmp/spire-kms/svid.pem
      - AUTH__SPIFFE__TLS_KEY_PATH=/tmp/spire-kms/key.pem
      - AUTH__SPIFFE__TRUST_BUNDLE_PATH=/tmp/spire-kms/bundle.pem
      - AUTH__SPIFFE__IDENTITY_MODE=Authoritative
    volumes:
      - ./crates/kms-service/config:/app/crates/kms-service/config:ro
      - spire-agent-socket:/tmp:ro
      - spire-kms:/tmp/spire-kms
    networks:
      - spire-net
    depends_on:
      spire-agent:
        condition: service_healthy

  test-client:
    image: ghcr.io/spiffe/spire-agent:1.11.1
    container_name: spire-test-client
    hostname: spire-test-client
    depends_on:
      spire-agent:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /tmp/spire-test-client && \
        /usr/local/bin/spire-agent api fetch x509 -socketPath /tmp/spire-agent.sock -write /tmp/spire-test-client && \
        openssl s_client -connect kms-spire-service:8080 -cert /tmp/spire-test-client/svid.pem -key /tmp/spire-test-client/key.pem -CAfile /tmp/spire-test-client/bundle.pem -verify_return_error -quiet
    volumes:
      - spire-agent-socket:/tmp:ro
      - spire-test-client:/tmp/spire-test-client
    networks:
      - spire-net

networks:
  spire-net:
    driver: bridge

volumes:
  spire-server-data:
  spire-agent-data:
  spire-agent-socket:
  spire-kms:
  spire-test-client:
