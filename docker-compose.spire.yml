# docker-compose.spire.yml

services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.1
    container_name: spire-server
    hostname: spire-server
    command: ["run", "-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./spire/server:/opt/spire/conf/server:ro
      - spire-server-data:/run/spire/data
    networks:
      - spire-net
    ports:
      - "8082:8081"
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.11.1
    container_name: spire-agent
    hostname: spire-agent
    depends_on:
      spire-agent-init:
        condition: service_completed_successfully
    entrypoint:
      - /opt/spire/bin/spire-agent
    command:
      - run
      - -config
      - /opt/spire/conf/agent/agent.conf
      - -joinTokenPath
      - /run/spire/tokens/agent_token
    volumes:
      - ./spire/agent:/opt/spire/conf/agent:ro
      - spire-agent-data:/run/spire/data
      - spire-agent-socket:/tmp
      - spire-agent-token:/run/spire/tokens:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - spire-net
    privileged: true
    pid: "host"
    healthcheck:
      test:
        [
          "CMD",
          "/opt/spire/bin/spire-agent",
          "healthcheck",
          "-socketPath",
          "/tmp/spire-agent.sock",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  spire-entries-init:
    image: ghcr.io/spiffe/spire-server:1.11.1
    container_name: spire-entries-init
    depends_on:
      spire-agent:
        condition: service_healthy
    entrypoint:
      - /opt/spire/bin/spire-server
    command:
      - entry
      - create
      - -config
      - /opt/spire/conf/server/server.conf
      - -spiffeID
      - spiffe://example.org/kms
      - -parentID
      - spiffe://example.org/spire/agent/join_token/kms-agent
      - -selector
      - docker:container_name:kms-spire-service
    volumes:
      - ./spire/server:/opt/spire/conf/server:ro
      - spire-server-data:/run/spire/data
    networks:
      - spire-net

  kms-spire-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kms-spire-service
    hostname: kms-spire-service
    command: cargo run -p kms-service -- serve
    ports:
      - "8081:8080"
    environment:
      - APP_CONFIG_PATH=/app/crates/kms-service/config/settings.toml
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=8080
      - DATABASE__HOST=postgres
      - DATABASE__PORT=5432
      - DATABASE__NAME=${DATABASE__NAME:-kms_db}
      - DATABASE__USER=${DATABASE__USER:-kms_app_user}
      - DATABASE__PASSWORD_FILE=/run/secrets/kms_app_db_pass
      - RUST_LOG=debug,kms_service=debug
      - AUTH__SPIFFE__ENABLED=true
      - AUTH__SPIFFE__TRUST_DOMAIN=example.org
      - AUTH__SPIFFE__WORKLOAD_ID=/kms
      - AUTH__SPIFFE__SPIRE_AGENT_SOCKET_PATH=/tmp/spire-agent.sock
      - AUTH__SPIFFE__IDENTITY_MODE=Authoritative
    secrets:
      - kms_app_db_pass
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
      - vhsm_sockets:/run/vhsm
      - ./crates/kms-service/config:/app/crates/kms-service/config:ro
      - spire-agent-socket:/tmp:ro
      - spire-agent-token:/run/spire/tokens:ro
    networks:
      - spire-net
      - kms-internal-net
    depends_on:
      postgres:
        condition: service_healthy
      spire-agent:
        condition: service_healthy
      spire-entries-init:
        condition: service_completed_successfully
      vhsm-daemon:
        condition: service_started

  spire-agent-init:
    image: ghcr.io/spiffe/spire-server:1.11.1
    container_name: spire-agent-init
    depends_on:
      spire-server:
        condition: service_healthy
    entrypoint:
      - /opt/spire/bin/spire-server
    command:
      - token
      - generate
      - -spiffeID
      - spiffe://example.org/spire/agent/join_token/kms-agent
      - -config
      - /opt/spire/conf/server/server.conf
      - -write
      - /run/spire/tokens/agent_token
    volumes:
      - ./spire/server:/opt/spire/conf/server:ro
      - spire-server-data:/run/spire/data
      - spire-agent-token:/run/spire/tokens
    networks:
      - spire-net

networks:
  spire-net:
    driver: bridge

volumes:
  spire-server-data:
  spire-agent-data:
  spire-agent-socket:
  spire-agent-token:
