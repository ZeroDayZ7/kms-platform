# docker-compose.spire.yml

services:
  # region spire-server
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.1
    container_name: spire-server
    hostname: spire-server
    command:
      [
        "/opt/spire/bin/spire-server",
        "run",
        "-config",
        "/opt/spire/conf/server/server.conf",
      ]
    volumes:
      - ./spire/server:/opt/spire/conf/server:ro
      - ./spire/server/data:/run/spire/data
      - spire-server-socket:/tmp/spire-server/private
    networks:
      - spire-net
    ports:
      - "8082:8081"
    healthcheck:
      test:
        [
          "CMD",
          "/opt/spire/bin/spire-server",
          "healthcheck",
          "-socketPath",
          "/tmp/spire-server/private/api.sock",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  # region spire-agent

  spire-agent:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/spiffe/spire-agent:1.11.1 AS spire
        FROM alpine:3.20
        RUN apk add --no-cache ca-certificates
        COPY --from=spire /opt/spire/bin/spire-agent /usr/local/bin/spire-agent
        RUN chmod +x /usr/local/bin/spire-agent
        ENTRYPOINT ["/bin/sh", "-c"]
    container_name: spire-agent
    hostname: spire-agent
    depends_on:
      spire-agent-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        TOKEN="$(cat /run/spire/tokens/agent_token)"
        exec /usr/local/bin/spire-agent run -config /opt/spire/conf/agent/agent.conf -joinToken "$$TOKEN"
    volumes:
      - ./spire/agent:/opt/spire/conf/agent:ro
      - spire-agent-data:/run/spire/data
      - spire-agent-socket:/tmp
      - spire-agent-token:/run/spire/tokens:ro
      - spire-bundle:/run/spire/bundle:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - spire-net
    privileged: true
    pid: "host"
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/spire-agent",
          "healthcheck",
          "-socketPath",
          "/tmp/spire-agent.sock",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # region spire-entries-init
  spire-entries-init:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/spiffe/spire-server:1.11.1 AS spire
        FROM alpine:3.20
        RUN apk add --no-cache ca-certificates
        COPY --from=spire /opt/spire/bin/spire-server /usr/local/bin/spire-server
        RUN chmod +x /usr/local/bin/spire-server
        ENTRYPOINT ["/bin/sh", "-c"]
    container_name: spire-entries-init
    depends_on:
      spire-server:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu

        # Czekanie na pojawienie się gniazda API serwera
        while [ ! -S /tmp/spire-server/private/api.sock ]; do
          sleep 0.5
        done

        if /usr/local/bin/spire-server entry show -spiffeID "spiffe://example.org/kms" -socketPath /tmp/spire-server/private/api.sock >/dev/null 2>&1; then
          echo "SPIRE entry już istnieje."
          exit 0
        fi

        /usr/local/bin/spire-server entry create \
          -socketPath /tmp/spire-server/private/api.sock \
          -spiffeID "spiffe://example.org/kms" \
          -selector "docker:container_name:kms-spire-service"
    volumes:
      - ./spire/server:/opt/spire/conf/server:ro
      - ./spire/server/data:/run/spire/data
      - spire-server-socket:/tmp/spire-server/private:ro
    networks:
      - spire-net

  # region spire-workload-init
  spire-workload-init:
    image: ghcr.io/spiffe/spire-agent:1.11.1
    container_name: spire-workload-init
    depends_on:
      spire-agent:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        mkdir -p /run/spire/workload
        until [ -S /tmp/spire-agent.sock ]; do
          sleep 0.5
        done

        /opt/spire/bin/spire-agent api fetch x509 \
          -socketPath /tmp/spire-agent.sock \
          -write /run/spire/workload

        # Normalize SPIRE output to stable names expected by the KMS service.
        find /run/spire/workload -maxdepth 1 -type f | while read -r file; do
          case "$$file" in
            *bundle*.pem|*bundle*.crt)
              cp "$$file" /run/spire/workload/bundle.pem
              ;;
            *svid_key*.pem|*key*.pem)
              cp "$$file" /run/spire/workload/svid_key.pem
              ;;
            *svid*.pem)
              if [ ! -f /run/spire/workload/svid.pem ]; then
                cp "$$file" /run/spire/workload/svid.pem
              fi
              ;;
          esac
        done

        ls -l /run/spire/workload
    volumes:
      - spire-agent-socket:/tmp:ro
      - spire-workload:/run/spire/workload
    networks:
      - spire-net

  # region kms-spire-service
  kms-spire-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kms-spire-service
    hostname: kms-spire-service
    command: cargo run -p kms-service -- serve
    ports:
      - "8081:8080"
    environment:
      - CARGO_BUILD_JOBS=2
      - APP_CONFIG_PATH=/app/crates/kms-service/config/settings.spire.toml
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=8080
      - DATABASE__HOST=postgres
      - DATABASE__PORT=5432
      - DATABASE__NAME=${DATABASE__NAME:-kms_db}
      - DATABASE__USER=${DATABASE__USER:-kms_app_user}
      - DATABASE__PASSWORD_FILE=/run/secrets/kms_app_db_pass
      - RUST_LOG=debug,kms_service=debug
      - APP_AUTH__SPIFFE__ENABLED=true
      - APP_AUTH__SPIFFE__TRUST_DOMAIN=example.org
      - APP_AUTH__SPIFFE__WORKLOAD_ID=/kms
      - APP_AUTH__SPIFFE__SPIRE_AGENT_SOCKET_PATH=/tmp/spire-agent.sock
      - APP_AUTH__SPIFFE__IDENTITY_MODE=Authoritative
      - APP_AUTH__SPIFFE__TLS_CERT_PATH=/run/spire/workload/svid.pem
      - APP_AUTH__SPIFFE__TLS_KEY_PATH=/run/spire/workload/svid_key.pem
      - APP_AUTH__SPIFFE__TRUST_BUNDLE_PATH=/run/spire/workload/bundle.pem
    secrets:
      - kms_app_db_pass
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
      - vhsm_sockets:/run/vhsm
      - ./crates/kms-service/config:/app/crates/kms-service/config:ro
      - spire-agent-socket:/tmp:ro
      - spire-agent-token:/run/spire/tokens:ro
      - spire-workload:/run/spire/workload:ro
    networks:
      - spire-net
      - kms-internal-net
    depends_on:
      postgres:
        condition: service_healthy
      spire-agent:
        condition: service_healthy
      spire-workload-init:
        condition: service_completed_successfully
      spire-entries-init:
        condition: service_completed_successfully
      vhsm-daemon:
        condition: service_started

  # region spire-agent-init
  spire-agent-init:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/spiffe/spire-server:1.11.1 AS spire
        FROM alpine:3.20
        RUN apk add --no-cache ca-certificates
        COPY --from=spire /opt/spire/bin/spire-server /usr/local/bin/spire-server
        RUN chmod +x /usr/local/bin/spire-server
        ENTRYPOINT ["/bin/sh", "-c"]
    container_name: spire-agent-init
    depends_on:
      spire-server:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        echo "Czekam na gniazdo API spire-server..."
        i=0
        while [ ! -S /tmp/spire-server/private/api.sock ]; do
          i=$$((i+1))
          if [ $$i -gt 60 ]; then
            echo "ERROR: Gniazdo SPIRE server nie pojawiło się" >&2
            exit 1
          fi
          sleep 0.5
        done

        # 1. Eksport Trust Bundle
        /usr/local/bin/spire-server bundle show \
          -socketPath /tmp/spire-server/private/api.sock > /run/spire/bundle/bundle.crt

        # 2. Generowanie Join Tokena
        TOKEN=$$(
          /usr/local/bin/spire-server token generate \
            -socketPath /tmp/spire-server/private/api.sock |
            awk 'NF {print $$NF; exit}'
        )

        printf '%s' "$$TOKEN" > /run/spire/tokens/agent_token
        chmod 600 /run/spire/tokens/agent_token
        echo "Trust bundle i token przygotowane."
    volumes:
      - ./spire/server:/opt/spire/conf/server:ro
      - ./spire/server/data:/run/spire/data
      - spire-agent-token:/run/spire/tokens
      - spire-server-socket:/tmp/spire-server/private:ro
      - spire-bundle:/run/spire/bundle
    networks:
      - spire-net

networks:
  spire-net:
    driver: bridge

volumes:
  spire-server-data:
  spire-agent-data:
  spire-agent-socket:
  spire-agent-token:
  spire-server-socket:
  spire-bundle:
  spire-workload:
