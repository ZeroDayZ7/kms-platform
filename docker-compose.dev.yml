# docker-compose.dev.yml

services:
  kms-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kms_service_dev
    command: cargo run -p kms-service -- serve
    ports:
      - "8081:8080"
    environment:
      - APP_CONFIG_PATH=/app/crates/kms-service/config/settings.toml
      - RUST_LOG=${LOG__LEVEL:-info},kms_ceremony_cli=debug,kms_core=debug,kms_db=debug,kms_migrate=debug,kms_service=debug
      - LOG__FORMAT=${LOG__FORMAT:-pretty}
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=8080
      - DATABASE__HOST=postgres
      - DATABASE__PORT=5432
      - DATABASE__NAME=${DATABASE__NAME:-kms_db}
      - DATABASE__USER=${DATABASE__USER:-kms_app_user}
      - DATABASE__PASSWORD_FILE=/run/secrets/kms_app_db_pass
    env_file:
      - .env.dev
    secrets:
      - kms_app_db_pass
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
      - vhsm_sockets:/run/vhsm
    networks:
      - kms-internal-net
      - sec-net
      - target-admin-net
    depends_on:
      postgres:
        condition: service_healthy
      vhsm-daemon:
        condition: service_started
