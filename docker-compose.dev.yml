# cmdr: docker-compose.dev.yml

services:
  # region POSTGRESQL
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  # ---------------------------------------------------------------------------
  # region KMS CEREMONY CLI (DEV)
  # ---------------------------------------------------------------------------
  kms-ceremony-cli:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: ""
    container_name: kms_ceremony_cli_dev
    entrypoint: []
    environment:
      - RUST_LOG=${RUST_LOG:-debug}
      - VHSM__SOCKET_PATH=/run/vhsm/vhsm.sock
      - CRYPTO__HSM_SOCKET_PATH=/run/vhsm/vhsm.sock
      - KMS_CLI__SERVICE_ID=kms-cli
      - KMS_CLI__SECRET=${ACL__SERVICES__KMS_CLI__SECRET:-super-long-random-secret-for-kms-cli-hmac-64-bytes}
      - KMS_CLI__SERVICE_URL=http://kms-service:8080
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
      - vhsm_sockets:/run/vhsm
    networks:
      - kms-internal-net
    depends_on:
      kms-service:
        condition: service_started
      vhsm-daemon:
        condition: service_started

  # ---------------------------------------------------------------------------
  # region MIGRATE
  # ---------------------------------------------------------------------------

  kms-migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: ""
    container_name: kms_migrate_dev
    entrypoint: []
    environment:
      - RUST_LOG=${RUST_LOG:-debug}
      - DATABASE__HOST=postgres
      - DATABASE__PORT=5432
      - DATABASE__NAME=${DATABASE__NAME:-kms_db}
      - DATABASE__USER=${DATABASE__MIGRATOR_USER:-kms_migrator_user}
      - DATABASE__PASSWORD_FILE=/run/secrets/kms_migrator_db_pass
      - MIGRATIONS_DIR=/app/crates/kms-migrate/migrations
    secrets:
      - kms_migrator_db_pass
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    networks:
      - kms-internal-net
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # region VHSM DAEMON (DEV)
  # ---------------------------------------------------------------------------
  vhsm-daemon:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: ""
    container_name: vhsm_daemon_dev
    entrypoint: []
    command: cargo run -p vhsm-daemon --bin vhsm-daemon
    environment:
      - RUST_LOG=${LOG__LEVEL:-debug}
      - LOG__FORMAT=${LOG__FORMAT:-pretty}
      - VHSM__SOCKET_PATH=/run/vhsm/vhsm.sock
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
      - vhsm_sockets:/run/vhsm
    networks:
      - kms-internal-net

  # ---------------------------------------------------------------------------
  # region KMS SERVICE (DEV)
  # ---------------------------------------------------------------------------
  kms-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: ""
    container_name: kms_service_dev
    command: cargo run -p kms-service -- serve
    ports:
      - "8081:8080"
    environment:
      - APP_CONFIG_PATH=/app/crates/kms-service/config/settings.toml
      - RUST_LOG=${LOG__LEVEL:-info},kms_ceremony_cli=debug,kms_core=debug,kms_db=debug,kms_migrate=debug,kms_service=debug
      - LOG__FORMAT=${LOG__FORMAT:-pretty}
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=8080
      - DATABASE__HOST=postgres
      - DATABASE__PORT=5432
      - DATABASE__NAME=${DATABASE__NAME:-kms_db}
      - DATABASE__USER=${DATABASE__USER:-kms_app_user}
      - DATABASE__PASSWORD_FILE=/run/secrets/kms_app_db_pass
    env_file:
      - .env.dev
    secrets:
      - kms_app_db_pass
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
      - vhsm_sockets:/run/vhsm
    networks:
      - kms-internal-net
      - sec-net
      - target-admin-net
    depends_on:
      postgres:
        condition: service_healthy
      vhsm-daemon:
        condition: service_started

# region VOLUMES
volumes:
  cargo_cache:
  target_cache:
