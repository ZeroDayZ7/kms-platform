[package]
name = "kms-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
rand = "0.10"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
sha2 = "0.10"
ssss = "1.0.6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.2"
