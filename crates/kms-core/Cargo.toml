[package]
name = "kms-core"
version = "0.1.0"
edition = "2024"

[dependencies]
# Unique dependencies for this crate
aes-gcm = "0.10.3"
argon2 = "0.5.3"
getrandom = "0.2"
ssss = "1.0.6"

# Shared dependencies inherited from the workspace
anyhow = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true }
zeroize = { workspace = true, features = ["zeroize_derive"] }
