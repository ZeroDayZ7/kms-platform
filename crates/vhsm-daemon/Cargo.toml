[package]
name = "vhsm-daemon"
version = "0.1.0"
edition = "2024"
default-run = "vhsm-daemon"

[dependencies]
# Unique dependencies for this crate
aes-gcm = "0.10.3"
base64 = "0.23.1"
hex = "0.4"
rand = "0.8"

# Shared dependencies inherited from the workspace
kms-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true, features = ["zeroize_derive"] }