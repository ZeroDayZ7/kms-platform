[package]
name = "kms-ceremony-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
# Unique dependencies for this crate
# none currently; the crate relies on shared workspace configuration

# Shared dependencies inherited from the workspace
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dialoguer = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
kms-core = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true }
zeroize = { workspace = true, features = ["zeroize_derive"] }
