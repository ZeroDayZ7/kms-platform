[package]
name = "kms-migrate"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
config = "0.15"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
kms-db = { path = "../kms-db" }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
