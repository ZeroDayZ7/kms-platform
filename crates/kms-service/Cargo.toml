[package]
name = "kms-service"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web Framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Cryptography & Security
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core", "pkcs8"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }
aes-gcm = "0.10.3"
pem = "3.0"

# Redis Client 
fred = { version = "10.1.0", features = ["serde-json", "enable-rustls", "i-scripts"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"

# Configuration & Env
config = "0.15"
dotenvy = "0.15"

# Middleware & Tower
tower = "0.5"
tower_governor = "0.8.0"
tower-http = { version = "0.6", features = ["trace", "cors", "set-header"] }
clap = { version = "4.5", features = ["derive"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time", "chrono"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1.24", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
governor = "0.10.4"
thiserror = "2.0.19"
anyhow = "1.0.104"
bson = { version = "2.15.0", features = ["uuid-1", "chrono-0_4"] }
async-trait = "0.1.91"
rand = "0.8"
base64 = "0.22.1"
serde_bytes = "0.11.19"
ssss = "1.0.6"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
kms-core = { path = "../kms-core" }

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
testcontainers = "0.27.3"
testcontainers-modules = "0.15.0"
toml = "0.8"
tempfile = "3.12"
