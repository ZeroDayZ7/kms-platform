[package]
name = "kms-service"
version = "0.1.0"
edition = "2024"

[dependencies]
# Unique dependencies for this crate
async-trait = "0.1.91"
base64 = "0.23.1"
config = "0.15"
dotenvy = "0.15"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core", "pkcs8"] }
fred = { version = "10.1.0", features = ["serde-json", "enable-rustls", "i-scripts", "i-acl"] }
url = "2"
governor = "0.10.4"
pem = "3.0"
pkcs8 = { version = "0.10", features = ["pem", "std"] }
rand = "0.8"
tower = "0.5"
tower_governor = "0.8.0"
tower-http = { version = "0.6", features = ["trace", "cors", "set-header"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

# Shared dependencies inherited from the workspace
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
kms-core = { workspace = true }
kms-db = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true, features = ["zeroize_derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
testcontainers = "0.27.3"
testcontainers-modules = "0.15.0"
toml = "0.8"
tempfile = "3.12"
