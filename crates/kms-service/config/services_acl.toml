[acl.services.kms-cli]
service_id = "kms-cli"
secret = "super-long-random-secret-for-kms-cli-hmac-64-bytes"
allowed_actions = ["AuditVerify", "AuditRead", "BootstrapImport"]
allowed_access = [
    { target_service = "hmac-gateway-auth", algorithm = "HmacSha256", access_level = "SecretKey", preload = true }
]

[acl.services.gateway-service]
service_id = "gateway-service"
secret = "super-long-random-secret-for-gateway-service-hmac-64-bytes"
allowed_access = [
    { target_service = "gateway-service", algorithm = "AES256GCM", access_level = "GenerateDataKey", preload = false },
    { target_service = "auth-service", algorithm = "Ed25519", access_level = "PublicKey", preload = true },
    { target_service = "shared-jwt", algorithm = "Ed25519", access_level = "PublicKey", preload = true },

    { target_service = "hmac-gateway-auth", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-gateway-identity", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-gateway-docs", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-gateway-messaging", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-gateway-officer-bff", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },

    # RabbitMQ dla Gateway
    { target_service = "hmac-gateway-rabbitmq", algorithm = "HmacSha256", access_level = "SecretKey", preload = true }
]

[acl.services.officer-bff]
service_id = "officer-bff"
secret = "super-long-random-secret-for-officer-bff-hmac-64-bytes"
allowed_access = [
    { target_service = "hmac-gateway-officer-bff", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },

    { target_service = "hmac-bff-auth", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-bff-identity", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-bff-docs", algorithm = "HmacSha256", access_level = "SecretKey", preload = true }
]

[acl.services.auth-service]
service_id = "auth-service"
secret = "super-long-random-secret-for-auth-service-hmac-64-bytes"
allowed_access = [
    { target_service = "auth-service", algorithm = "Ed25519", access_level = "PublicKey", preload = true },
    { target_service = "shared-jwt", algorithm = "Ed25519", access_level = "PrivateKey", preload = true },

    { target_service = "hmac-gateway-auth", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-bff-auth", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },

    # RabbitMQ dla Auth-Service
    { target_service = "hmac-auth-rabbitmq", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-identity-rabbitmq", algorithm = "HmacSha256", access_level = "SecretKey", preload = true }
]

[acl.services.identity-service]
service_id = "identity-service"
secret = "super-long-random-secret-for-identity-service-hmac-64-bytes"
allowed_access = [
 # Szyfrowanie danymi symetrycznymi (AES256GCM)
    { target_service = "identity-service", algorithm = "AES256GCM", access_level = "GenerateDataKey", preload = false },
    { target_service = "identity-citizen-key", algorithm = "AES256GCM", access_level = "SecretKey", preload = true },
    { target_service = "identity-agreements-key", algorithm = "AES256GCM", access_level = "SecretKey", preload = true },
    { target_service = "identity-phone-key", algorithm = "AES256GCM", access_level = "SecretKey", preload = true },
    { target_service = "identity-email-key", algorithm = "AES256GCM", access_level = "SecretKey", preload = true },

    # Integralność / Haszowanie / HMAC (HmacSha256)
    { target_service = "hmac-identity-pesel-index", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-identity-phone-index", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-identity-email-index", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-identity-puk-index", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    
    { target_service = "hmac-gateway-identity", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-bff-identity", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-auth-rabbitmq", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-identity-rabbitmq", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-identity-audit", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },

    
]

[acl.services.citizen-docs-service]
service_id = "citizen-docs-service"
secret = "super-long-random-secret-for-docs-service-hmac-64-bytes"
allowed_access = [
    { target_service = "docs-id-cards", algorithm = "AES256GCM", access_level = "SecretKey", preload = true },
    { target_service = "docs-driver-license", algorithm = "AES256GCM", access_level = "SecretKey", preload = true },
    { target_service = "docs-passport", algorithm = "AES256GCM", access_level = "SecretKey", preload = true },

    { target_service = "hmac-gateway-docs", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },
    { target_service = "hmac-bff-docs", algorithm = "HmacSha256", access_level = "SecretKey", preload = true },

    # DODANY KLUCZ PESEL INDEX:
    { target_service = "hmac-docs-pesel-index", algorithm = "HmacSha256", access_level = "SecretKey", preload = true }
]

[acl.services.messaging-service]
service_id = "messaging-service"
secret = "super-long-random-secret-for-messaging-service-hmac-64-bytes"
allowed_access = [
    { target_service = "hmac-gateway-messaging", algorithm = "HmacSha256", access_level = "SecretKey", preload = true }
]