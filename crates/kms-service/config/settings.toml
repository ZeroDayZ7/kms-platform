[server]
host = "0.0.0.0"
port = 8080
shutdown_timeout = 30

[log]
level = "debug"
format = "json"

[cors]
allowed_methods = ["GET", "POST", "OPTIONS", "PATCH"]
max_age = 3600

[cors.allowed_origin]
type = "List"
value = [
  "http://localhost:3000",
  "https://myapp.com",
  "https://admin.myapp.com"
]

[database]
host = "127.0.0.1"
port = 5440
name = "kms_db"
pool_size = 5

[redis]
enabled = false
host = "127.0.0.1"
port = 6380
db = 0

[rate_limit]
global_per_second = 50
global_burst = 100
health_per_second = 50
health_burst = 100
auth_per_second = 50
auth_burst = 100

# ==============================================================================
# VHSM Crypto Config (Pure Client Mode)
# ==============================================================================
[crypto]
hsm_socket_path = "/run/vhsm/vhsm.sock"
current_master_key_version = 1
default_key_ttl_days = 365
grace_period_minutes = 30
hsm_timeout_secs = 5
enable_http_rewrap = false