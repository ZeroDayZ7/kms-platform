[package]
name = "kms-db"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.24", features = ["v4", "v7", "serde"] }
tracing = "0.1"
zeroize = { version = "1.8", features = ["zeroize_derive", "serde"] }
