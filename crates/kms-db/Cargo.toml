[package]
name = "kms-db"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
tracing = "0.1"
zeroize = { version = "1.8", features = ["zeroize_derive", "serde"] }
